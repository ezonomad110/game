<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重棋 (Chogi) ルールブック</title>
    <style>
        body {
            font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
            background-color: #0a0908;
            color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            max-width: 600px;
            width: 100%;
            background: #17130e;
            border: 3px solid #dcb35c;
            border-radius: 8px;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h1 { color: #f3e5c8; text-align: center; border-bottom: 2px solid #dcb35c; padding-bottom: 10px; margin-top: 0; }
        h2 { color: #ffadad; font-size: 1.1rem; margin-top: 20px; border-left: 4px solid #ffadad; padding-left: 8px; }
        p, li { font-size: 0.9rem; line-height: 1.6; color: #e0d8c8; }
        ul { padding-left: 20px; }
        .back-btn {
            display: block;
            width: 100%;
            max-width: 200px;
            margin: 30px auto 0 auto;
            padding: 10px;
            background: #dcb35c;
            color: #2b2b2b;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border-radius: 4px;
        }
        .back-btn:hover { background: #f3e5c8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>重棋 (Chogi) ルールブック</h1>
        
        <h2>1. 概要</h2>
        <p>通常の9×9将棋盤で、自分の駒同士を重ねてパワーアップさせるゲームです。<strong>重ねた駒は、含まれているすべての駒の動きを組み合わせて移動させることができます。</strong></p>

        <h2>2. 合体（スタッキング）制限</h2>
        <ul>
            <li>1つのマスに重ねられるのは<strong>最大4つまで</strong>です（5個以上の合体や移動は不可）。</li>
            <li><strong>自分の「歩」との合体は禁止です。</strong>「二歩」も禁止されています。</li>
            <li>王将（玉将）は他の駒と合体できません。</li>
        </ul>

        <h2>3. 勝利条件</h2>
        <p>相手の王将を捕らえた方の勝ちとなります。</p>

        <a href="index.html" class="back-btn">ゲームに戻る</a>
    </div>
</body>
</html>
