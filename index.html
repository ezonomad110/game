<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>合体将棋 (Gattai Shogi)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div style="display: flex; justify-content: space-between; align-items: baseline; width: 100%; max-width: 440px; padding: 0 4px;">
        <h1 style="margin: 4px 0;">合体将棋</h1>
        <span style="font-size: 0.75rem; color: #ffadad; font-weight: bold;">[v3.0 適用中]</span>
    </div>
    <div id="status">先手の番です</div>

    <div class="hand-container" id="gote-hand">
        <span class="hand-label">後手持ち駒:</span>
        <div id="gote-hand-pieces" class="hand-pieces-inner gote-pieces"></div>
    </div>

    <div id="board-container"></div>

    <div class="hand-container" id="sente-hand">
        <span class="hand-label">先手持ち駒:</span>
        <div id="sente-hand-pieces" class="hand-pieces-inner"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
