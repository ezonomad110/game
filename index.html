<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>重棋 (Chogi)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-area">
        <h1>重棋 <span class="header-ruby">(ちょうぎ)</span></h1>
        <div class="header-right">
            <button class="header-btn" onclick="openModeModal()">モード設定</button>
            <a href="rules.html" target="_blank" class="header-btn rules-link">ルール</a>
            <span class="version-badge">[v3.9]</span>
        </div>
    </div>

    <!-- 後手エリア -->
    <div class="player-hud gote-hud" id="gote-hud">
        <div class="hud-info">
            <span class="player-name" id="gote-name">後手 (CPU)</span>
            <span class="turn-indicator">▼ 手番</span>
        </div>
        <div class="hand-container" id="gote-hand">
            <div id="gote-hand-pieces" class="hand-pieces-inner gote-pieces"></div>
        </div>
    </div>

    <!-- 座標付き将棋盤 -->
    <div class="shogi-board-wrapper">
        <div class="coords-top">
            <span>9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
        </div>
        <div class="board-with-side">
            <div id="board-container"></div>
            <div class="coords-right">
                <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>七</span><span>八</span><span>九</span>
            </div>
        </div>
    </div>

    <!-- 先手エリア -->
    <div class="player-hud sente-hud" id="sente-hud">
        <div class="hand-container" id="sente-hand">
            <div id="sente-hand-pieces" class="hand-pieces-inner"></div>
        </div>
        <div class="hud-info">
            <span class="player-name" id="sente-name">先手 (あなた)</span>
            <span class="turn-indicator">▲ 手番</span>
        </div>
    </div>

    <!-- モード・難易度選択モーダル -->
    <div id="mode-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>対局モードを選択</h2>
            <div class="modal-buttons">
                <button class="mode-select-btn" onclick="setGameMode('pvp', 0)">対人戦 (2人プレイ)</button>
                <button class="mode-select-btn cpu-btn" onclick="setGameMode('cpu', 1)">vs CPU (初級)</button>
                <button class="mode-select-btn cpu-btn" onclick="setGameMode('cpu', 2)">vs CPU (中級)</button>
                <button class="mode-select-btn cpu-btn" onclick="setGameMode('cpu', 3)">vs CPU (上級)</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
