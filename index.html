<!DOCTYPE html>
<html lang="ja" data-html-version="v3.60">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重棋 (ちょうぎ)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="header-inner">
            <h1>重棋 <span class="sub-title">(ちょうぎ)</span></h1>
            <div class="header-buttons">
                <button class="action-btn" onclick="undoMove()">待った</button>
                <button class="action-btn" onclick="openModeModal()">モード設定</button>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div class="board-section">
            <div id="gote-hud" class="player-hud">
                <span id="gote-name" class="player-name">後手 (CPU)</span>
                <div id="gote-hand-pieces" class="hand-pieces-container"></div>
            </div>

            <div id="board-container"></div>

            <div id="sente-hud" class="player-hud">
                <span class="player-name">先手 (あなた)</span>
                <div id="sente-hand-pieces" class="hand-pieces-container"></div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-box">
                <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #5a4531; padding-bottom: 5px; margin-bottom: 10px;">
                    <h3 style="margin: 0; border: none; padding: 0;">対局ログ (動き・合体履歴)</h3>
                    <button class="action-btn" onclick="copyGameLogs()" style="padding: 3px 8px; font-size: 0.75rem;">コピー</button>
                </div>
                <div id="game-log-container"></div>
            </div>
        </div>
    </div>

    <!-- モーダル各種 -->
    <div id="mode-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>重棋</h2>
            <p style="color: #dcb35c; letter-spacing: 3px; margin-top: -6px;">― 重ねて、強くなる ―</p>
            <p>対局モードを選んでください</p>
            <div class="modal-buttons">
                <button onclick="setGameMode('cpu', 1)">CPU対戦 (初級)</button>
                <button onclick="setGameMode('cpu', 2)">CPU対戦 (中級)</button>
                <button onclick="setGameMode('cpu', 3)">CPU対戦 (上級・強)</button>
                <button onclick="setGameMode('pvp', 0)">2人対戦 (PvP)</button>
            </div>
            <div style="margin-top: 15px;">
                <button class="action-btn" onclick="openRuleModal()" style="width: 100%; padding: 8px;">ルール・遊び方</button>
            </div>
            <div class="version-badge-modal">
                HTML: <span id="html-version">v3.60</span> / 
                JS: <span id="js-version">v3.60</span> / 
                CSS: <span id="css-version">v3.60</span>
            </div>
        </div>
    </div>

    <div id="rule-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content" style="max-width: 450px; text-align: left;">
            <h2 style="text-align: center;">重棋のルール</h2>
            <p style="font-size: 0.9rem; line-height: 1.5;">
                ・9x9マスの将棋盤で行う変則ルールのボードゲームです。<br>
                ・同じマスに自分の駒が移動すると、最大4つまで「合体駒」として重なります。<br>
                ・敵陣に入ると成ることができます。<br>
                ・相手の王将を捉えるか、動けなくすると勝利です。
            </p>
            <div class="modal-buttons" style="margin-top: 20px;">
                <button onclick="closeRuleModal()" style="width: 100%;">閉じる</button>
            </div>
        </div>
    </div>

    <div id="promote-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="promote-modal-title">成りますか？</h2>
            <div class="modal-buttons" style="flex-direction: row; justify-content: center; gap: 15px;">
                <button onclick="resolvePromote(true)" style="flex: 1;">成る</button>
                <button onclick="resolvePromote(false)" style="flex: 1; background: #555;">成らず</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
