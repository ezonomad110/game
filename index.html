<!DOCTYPE html>
<html lang="ja" data-html-version="v3.55">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>重棋 (ちょうぎ)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; max-width: 500px; padding: 0 10px; box-sizing: border-box;">
            <h1 style="margin: 0;">重棋 <span style="font-size: 0.9rem; font-weight: normal;">(ちょうぎ)</span></h1>
            <div style="display: flex; gap: 8px;">
                <button class="action-btn" onclick="undoMove()" style="padding: 6px 12px; font-size: 0.85rem;">待った</button>
                <button class="action-btn" onclick="openModeModal()" style="padding: 6px 12px; font-size: 0.85rem;">モード設定</button>
            </div>
            <!-- 各ファイルのバージョンを自己申告して表示するバッジ -->
            <div class="version-badge" style="font-size: 0.75rem; text-align: right; line-height: 1.3; padding: 4px 8px;">
                HTML: <span id="html-version">v3.55</span><br>
                JS: <span id="js-version">v3.55</span><br>
                CSS: <span id="css-version">v3.55</span>
            </div>
        </div>
    </header>

    <!-- 以下、メインコンテンツやボードのコンテナ -->
    <div class="main-container">
        <div class="board-section">
            <div id="gote-hud" class="player-hud">
                <span id="gote-name" class="player-name">後手 (CPU)</span>
                <div id="gote-hand-pieces" class="hand-pieces-container"></div>
            </div>

            <div id="board-container"></div>

            <div id="sente-hud" class="player-hud">
                <span class="player-name">先手 (あなた)</span>
                <div id="sente-hand-pieces" class="hand-pieces-container"></div>
            </div>
        </div>

        <div class="side-panel">
            <div class="panel-box">
                <h3>対局ログ (動き・合体履歴)</h3>
                <div id="game-log-container"></div>
            </div>
        </div>
    </div>

    <!-- モーダル各種 -->
    <div id="mode-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2>重棋へようこそ</h2>
            <p>対局モードを選んでください</p>
            <div class="modal-buttons">
                <button onclick="setGameMode('cpu', 1)">CPU対戦 (初級)</button>
                <button onclick="setGameMode('cpu', 2)">CPU対戦 (中級)</button>
                <button onclick="setGameMode('cpu', 3)">CPU対戦 (上級・強)</button>
                <button onclick="setGameMode('pvp', 0)">2人対戦 (PvP)</button>
            </div>
        </div>
    </div>

    <div id="promote-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <h2 id="promote-modal-title">成りますか？</h2>
            <div class="modal-buttons" style="flex-direction: row; justify-content: center; gap: 15px;">
                <button onclick="resolvePromote(true)" style="flex: 1;">成る</button>
                <button onclick="resolvePromote(false)" style="flex: 1; background: #555;">成らず</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
