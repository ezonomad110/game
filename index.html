<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>重棋 (Chogi)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="header-area">
        <h1>重棋 <span class="header-ruby">(ちょうぎ)</span></h1>
        <div class="header-right">
            <button class="header-btn" onclick="openModeModal()">モード設定</button>
            <span class="version-badge">[v3.16]</span>
        </div>
    </div>

    <!-- 後手エリア -->
    <div class="player-hud gote-hud" id="gote-hud">
        <div class="hud-info">
            <span class="player-name" id="gote-name">後手 (CPU)</span>
            <span class="turn-indicator">▼ 手番</span>
        </div>
        <div class="hand-container" id="gote-hand">
            <div id="gote-hand-pieces" class="hand-pieces-inner gote-pieces"></div>
        </div>
    </div>

    <!-- 座標付き将棋盤 -->
    <div class="shogi-board-wrapper">
        <div class="coords-top">
            <span>9</span><span>8</span><span>7</span><span>6</span><span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
        </div>
        <div class="board-with-side">
            <div id="board-container"></div>
            <div class="coords-right">
                <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>七</span><span>八</span><span>九</span>
            </div>
        </div>
    </div>

    <!-- 先手エリア -->
    <div class="player-hud sente-hud" id="sente-hud">
        <div class="hand-container" id="sente-hand">
            <div id="sente-hand-pieces" class="hand-pieces-inner"></div>
        </div>
        <div class="hud-info">
            <span class="player-name" id="sente-name">先手 (あなた)</span>
            <span class="turn-indicator">▲ 手番</span>
        </div>
    </div>

    <!-- モード・難易度選択モーダル -->
    <div id="mode-modal" class="modal-overlay" style="display: flex;">
        <div class="modal-content">
            <h2>対局モードを選択</h2>
            <div class="modal-buttons">
                <button class="mode-select-btn" onclick="setGameMode('pvp', 0)">対人戦 (2人プレイ)</button>
                <button class="mode-select-btn cpu-btn" onclick="setGameMode('cpu', 1)">vs CPU (初級)</button>
                <button class="mode-select-btn cpu-btn" onclick="setGameMode('cpu', 2)">vs CPU (中級)</button>
                <button class="mode-select-btn cpu-btn" onclick="setGameMode('cpu', 3)">vs CPU (上級・強)</button>
                <button class="mode-select-btn rule-open-btn" onclick="openRuleModalFromModal()">ルールを読む</button>
            </div>
        </div>
    </div>

    <!-- ルールブック モーダル -->
    <div id="rule-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content rule-modal-content">
            <h2>重棋 (Chogi) ルール</h2>
            <div class="rule-body">
                <p><strong>1. 概要:</strong> 通常の9×9将棋盤で、自分の駒同士を重ねてパワーアップさせるゲームです。</p>
                <p><strong>2. 合体（スタッキング）制限:</strong></p>
                <ul>
                    <li>1つのマスに重ねられるのは<strong>最大4つまで</strong>です（5個以上の合体や移動は不可）。</li>
                    <li>自分の「歩」同士の合体は禁止です。「二歩」も禁止されています。</li>
                    <li>王将（玉将）は他の駒と合体できません。</li>
                </ul>
                <p><strong>3. 勝利条件:</strong> 相手の王将を捕らえた方の勝ちとなります。</p>
            </div>
            <button class="mode-select-btn" onclick="closeRuleModal()">閉じる</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
